name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    name: Python Lint, Typecheck, and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Mypy Typecheck
        run: uv run mypy pipeline services/api

      - name: Run Pytest
        run: uv run pytest

  web-checks:
    name: Web Lint, Typecheck, and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Web Typecheck
        working-directory: apps/web
        run: pnpm typecheck

      - name: Web Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Web Tests
        working-directory: apps/web
        run: pnpm test
