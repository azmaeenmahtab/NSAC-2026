[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyroscope-api"
version = "0.1.0"
description = "FastAPI backend service for PyroScope"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "duckdb>=1.0.0",
    "slowapi>=0.1.9",
    "rapidfuzz>=3.9.0",
    "httpx>=0.27.0",
    "pyroscope-pipeline",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
pyroscope-pipeline = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

