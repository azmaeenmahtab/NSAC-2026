[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyroscope-pipeline"
version = "0.1.0"
description = "PyroScope NASA MODIS and VIIRS fire data harmonization pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "h3>=4.1.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyroscope_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

