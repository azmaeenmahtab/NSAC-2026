# PyroScope Pipeline Configuration
# Default parameters defined in PRODUCT_BRIEF.md section 5

data:
  root_dir: "../data"
  raw_dir: "../data/raw"
  interim_dir: "../data/interim"
  processed_dir: "../data/processed"
  reference_dir: "../data/reference"
  fixtures_dir: "../data/fixtures"

sources:
  modis:
    product: "MCD14DL"
    collection: "C6.1"
    min_confidence: 30
    require_type_zero: true
  viirs:
    product: "VNP14IMGTDL"
    allowed_confidence: ["n", "h"]

clustering:
  algorithm: "st_dbscan"
  eps_spatial_meters: 2700.0
  eps_temporal_hours: 24.0
  min_pts: 2

spatial:
  bbox_bangladesh: [88.0, 20.5, 92.8, 26.7]
  h3_resolutions: [5, 6, 7]

harmonization:
  min_mean_monthly_modis: 3
  month_pool_width: 1
  cv_method: "leave_one_year_out"
  methods: ["quantile_map", "ratio"]
  percentiles: [50, 90, 95]
  season_share_threshold: 0.7

