<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" style="background:#080B10;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E141F"/>
      <stop offset="100%" stop-color="#141D2D"/>
    </linearGradient>
  </defs>

  <!-- HEADER (Height: 64px) -->
  <rect x="0" y="0" width="1440" height="64" fill="url(#headerGrad)" stroke="#1F293D" stroke-width="1"/>
  <circle cx="36" cy="32" r="14" fill="#FF6B00"/>
  <path d="M30 38 Q36 22 42 38 Q36 34 30 38" fill="#FFF"/>
  <text x="60" y="38" fill="#F8FAFC" font-size="18" font-weight="700">PyroScope</text>
  <rect x="156" y="22" width="130" height="20" rx="4" fill="#1F293D"/>
  <text x="164" y="36" fill="#94A3B8" font-size="10" font-weight="600">NASA Space Apps 2026</text>

  <!-- Navigation -->
  <text x="1115" y="37" fill="#94A3B8" font-size="13">Mission Control</text>
  <text x="1225" y="37" fill="#FF6B00" font-size="13" font-weight="600">Hidden Jump</text>
  <text x="1310" y="37" fill="#94A3B8" font-size="13">Ask Assistant</text>
  <text x="1395" y="37" fill="#94A3B8" font-size="13">Docs</text>

  <!-- PAGE CONTAINER -->
  <g transform="translate(60, 90)">
    <!-- Title and Scientific Problem Statement -->
    <text x="0" y="24" fill="#F8FAFC" font-size="24" font-weight="700">The "Hidden Jump": Why Naive Satellite Splicing Misleads</text>
    <text x="0" y="48" fill="#94A3B8" font-size="13">
      In 2012, NASA launched the VIIRS sensor (375 m resolution) alongside MODIS (1 km). VIIRS detects ~4.1× more hot spots than MODIS.
    </text>
    <text x="0" y="66" fill="#94A3B8" font-size="13">
      Splicing the raw data creates an illusion of a 400% wildfire explosion in 2012. PyroScope ST-DBSCAN clustering and quantile mapping restores scientific parity.
    </text>

    <!-- Key Comparison Cards (Top) -->
    <g transform="translate(0, 84)">
      <!-- Card 1: Naive Splice Error -->
      <rect x="0" y="0" width="310" height="84" rx="8" fill="#161F30" stroke="#A855F7" stroke-width="1.5"/>
      <text x="16" y="24" fill="#A855F7" font-size="12" font-weight="600">Naive Splice (Raw MODIS → Raw VIIRS)</text>
      <text x="16" y="54" fill="#F8FAFC" font-size="24" font-weight="700">+311% Jump</text>
      <text x="175" y="54" fill="#EF4444" font-size="12" font-weight="600">⚠ Artifact</text>
      <text x="16" y="72" fill="#94A3B8" font-size="10">False climate trend caused by sensor change</text>

      <!-- Card 2: Empirical Pixel Ratio -->
      <rect x="330" y="0" width="310" height="84" rx="8" fill="#161F30" stroke="#1F293D"/>
      <text x="16" y="24" fill="#94A3B8" font-size="12" font-weight="600">Raw Pixel Ratio (Overlap 2012–2026)</text>
      <text x="16" y="54" fill="#F8FAFC" font-size="24" font-weight="700">4.10× VIIRS : MODIS</text>
      <text x="16" y="72" fill="#94A3B8" font-size="10">39,193 raw VIIRS vs 9,645 raw MODIS / year</text>

      <!-- Card 3: Physical Cluster Ratio -->
      <rect x="660" y="0" width="310" height="84" rx="8" fill="#161F30" stroke="#1F293D"/>
      <text x="16" y="24" fill="#94A3B8" font-size="12" font-weight="600">ST-DBSCAN Event Ratio</text>
      <text x="16" y="54" fill="#F8FAFC" font-size="24" font-weight="700">1.54× VIIRS : MODIS</text>
      <text x="16" y="72" fill="#94A3B8" font-size="10">~860 VIIRS events vs ~560 MODIS events / year</text>

      <!-- Card 4: Harmonized Result -->
      <rect x="990" y="0" width="330" height="84" rx="8" fill="#161F30" stroke="#FF6B00" stroke-width="1.5"/>
      <text x="16" y="24" fill="#FF6B00" font-size="12" font-weight="600">PyroScope Harmonized Series</text>
      <text x="16" y="54" fill="#F8FAFC" font-size="24" font-weight="700">0% Artificial Jump</text>
      <text x="200" y="54" fill="#10B981" font-size="12" font-weight="600">✓ Calibrated</text>
      <text x="16" y="72" fill="#94A3B8" font-size="10">Quantile-mapped to MODIS 26-year baseline</text>
    </g>

    <!-- Main Chart Area (Width: 1320px, Height: 440px) -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="1320" height="440" rx="8" fill="#0E141F" stroke="#1F293D" stroke-width="1"/>

      <!-- Chart Title and Series Toggles -->
      <g transform="translate(24, 20)">
        <text x="0" y="16" fill="#F8FAFC" font-size="15" font-weight="600">Annual Active-Fire Count in Bangladesh (2000–2026)</text>
        
        <!-- Legend Pills -->
        <g transform="translate(600, 0)">
          <!-- Naive Splice -->
          <line x1="0" y1="12" x2="24" y2="12" stroke="#A855F7" stroke-width="3"/>
          <text x="30" y="16" fill="#A855F7" font-size="11" font-weight="600">Naive Splice (Spurious Leap)</text>

          <!-- Raw VIIRS -->
          <line x1="220" y1="12" x2="244" y2="12" stroke="#F43F5E" stroke-width="2" stroke-dasharray="4 2"/>
          <text x="250" y="16" fill="#F43F5E" font-size="11">Raw VIIRS (from 2012)</text>

          <!-- Raw MODIS -->
          <line x1="420" y1="12" x2="444" y2="12" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 2"/>
          <text x="450" y="16" fill="#38BDF8" font-size="11">Raw MODIS (2000–2026)</text>

          <!-- PyroScope Harmonized -->
          <line x1="600" y1="12" x2="628" y2="12" stroke="#FF6B00" stroke-width="3.5"/>
          <text x="635" y="16" fill="#FF6B00" font-size="11" font-weight="700">PyroScope Harmonized</text>
        </g>
      </g>

      <!-- Chart Axes & Grid -->
      <g transform="translate(60, 60)">
        <!-- Horizontal Grid Lines -->
        <line x1="0" y1="0" x2="1220" y2="0" stroke="#1F293D" stroke-dasharray="3 3"/>
        <text x="-45" y="5" fill="#64748B" font-size="10" font-family="monospace">40k</text>

        <line x1="0" y1="80" x2="1220" y2="80" stroke="#1F293D" stroke-dasharray="3 3"/>
        <text x="-45" y="85" fill="#64748B" font-size="10" font-family="monospace">30k</text>

        <line x1="0" y1="160" x2="1220" y2="160" stroke="#1F293D" stroke-dasharray="3 3"/>
        <text x="-45" y="165" fill="#64748B" font-size="10" font-family="monospace">20k</text>

        <line x1="0" y1="240" x2="1220" y2="240" stroke="#1F293D" stroke-dasharray="3 3"/>
        <text x="-45" y="245" fill="#64748B" font-size="10" font-family="monospace">10k</text>

        <line x1="0" y1="320" x2="1220" y2="320" stroke="#2D3B55" stroke-width="1.5"/>
        <text x="-45" y="325" fill="#64748B" font-size="10" font-family="monospace">0</text>

        <!-- Vertical Sensor Transition Shading (2012) -->
        <rect x="520" y="0" width="700" height="320" fill="rgba(244, 63, 94, 0.04)"/>
        <line x1="520" y1="0" x2="520" y2="320" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="525" y="20" fill="#EF4444" font-size="11" font-weight="700">2012: VIIRS S-NPP Launch</text>

        <!-- X Axis Year Labels -->
        <g transform="translate(0, 340)" fill="#94A3B8" font-size="11" font-family="monospace">
          <text x="10" y="0">2001</text>
          <text x="140" y="0">2004</text>
          <text x="270" y="0">2007</text>
          <text x="400" y="0">2010</text>
          <text x="515" y="0" fill="#EF4444" font-weight="700">2012</text>
          <text x="660" y="0">2015</text>
          <text x="790" y="0">2018</text>
          <text x="920" y="0">2021</text>
          <text x="1050" y="0">2024</text>
          <text x="1160" y="0">2026</text>
        </g>

        <!-- 1. Raw MODIS Line (Blue, ~8,000-11,000 range, y around 240-260) -->
        <path d="M10 260 L60 250 L140 240 L210 255 L270 245 L350 250 L420 235 L480 255 L520 245 L600 240 L690 250 L770 235 L860 245 L950 240 L1030 250 L1120 245 L1190 250"
              fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3"/>

        <!-- 2. Raw VIIRS Line (Rose, starts at 2012 x=520, ~36,000-42,000 range, y around 30-70) -->
        <path d="M520 60 L600 45 L690 70 L770 35 L860 55 L950 40 L1030 65 L1120 50 L1190 55"
              fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="5 3"/>

        <!-- 3. Naive Splice (Purple: follows MODIS then spikes directly up to VIIRS in 2012!) -->
        <path d="M10 260 L60 250 L140 240 L210 255 L270 245 L350 250 L420 235 L480 255 L520 60 L600 45 L690 70 L770 35 L860 55 L950 40 L1030 65 L1120 50 L1190 55"
              fill="none" stroke="#A855F7" stroke-width="3"/>
        <!-- Spurious jump annotation arrow -->
        <path d="M510 245 Q 490 150 515 70" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
        <rect x="360" y="130" width="145" height="40" rx="4" fill="#0E141F" stroke="#EF4444"/>
        <text x="368" y="148" fill="#EF4444" font-size="10" font-weight="700">Fake +311% Jump</text>
        <text x="368" y="162" fill="#94A3B8" font-size="9">(Due to 375m pixels)</text>

        <!-- 4. PyroScope Harmonized (Orange: thick, continuous, calibrated down to MODIS baseline) -->
        <path d="M10 260 L60 250 L140 240 L210 255 L270 245 L350 250 L420 235 L480 255 L520 248 L600 242 L690 252 L770 238 L860 246 L950 242 L1030 251 L1120 247 L1190 249"
              fill="none" stroke="#FF6B00" stroke-width="4"/>
        
        <!-- Harmonized smooth continuation callout -->
        <rect x="680" y="270" width="220" height="36" rx="4" fill="#0E141F" stroke="#FF6B00"/>
        <text x="690" y="286" fill="#FF6B00" font-size="10" font-weight="700">PyroScope Harmonized Line</text>
        <text x="690" y="298" fill="#10B981" font-size="9">✓ Consistent 2000–2026 Climate Baseline</text>
      </g>
    </g>

    <!-- Bottom Explanatory Workflow (Clustering + Quantile Mapping) -->
    <g transform="translate(0, 650)">
      <rect x="0" y="0" width="1320" height="100" rx="8" fill="#161F30" stroke="#1F293D"/>
      <text x="24" y="24" fill="#F8FAFC" font-size="13" font-weight="600">The PyroScope Harmonization Pipeline Solution</text>

      <g transform="translate(24, 40)">
        <circle cx="12" cy="16" r="12" fill="#FF6B00"/>
        <text x="9" y="20" fill="#FFF" font-size="11" font-weight="700">1</text>
        <text x="32" y="14" fill="#F8FAFC" font-size="12" font-weight="600">Raw Hot Spot Filtering</text>
        <text x="32" y="30" fill="#94A3B8" font-size="10">Filters low-confidence noise &amp; offshore flares</text>

        <circle cx="340" cy="16" r="12" fill="#FF6B00"/>
        <text x="337" y="20" fill="#FFF" font-size="11" font-weight="700">2</text>
        <text x="360" y="14" fill="#F8FAFC" font-size="12" font-weight="600">ST-DBSCAN Event Clustering</text>
        <text x="360" y="30" fill="#94A3B8" font-size="10">2.7 km / 24 hr spatio-temporal grouping</text>

        <circle cx="680" cy="16" r="12" fill="#FF6B00"/>
        <text x="677" y="20" fill="#FFF" font-size="11" font-weight="700">3</text>
        <text x="700" y="14" fill="#F8FAFC" font-size="12" font-weight="600">Quantile Mapping Transfer</text>
        <text x="700" y="30" fill="#94A3B8" font-size="10">Calibrates VIIRS distribution to MODIS record</text>

        <circle cx="1020" cy="16" r="12" fill="#FF6B00"/>
        <text x="1017" y="20" fill="#FFF" font-size="11" font-weight="700">4</text>
        <text x="1040" y="14" fill="#F8FAFC" font-size="12" font-weight="600">H3 Cell Proportional Allocation</text>
        <text x="1040" y="30" fill="#94A3B8" font-size="10">Downscales harmonized totals without loss</text>
      </g>
    </g>
  </g>
</svg>
