<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%" style="background:#080B10;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="headerGradMob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E141F"/>
      <stop offset="100%" stop-color="#141D2D"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161F30"/>
      <stop offset="100%" stop-color="#0E141F"/>
    </linearGradient>
    <linearGradient id="infernoMob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000004"/>
      <stop offset="30%" stop-color="#651A80"/>
      <stop offset="70%" stop-color="#D44842"/>
      <stop offset="100%" stop-color="#FCFFA4"/>
    </linearGradient>
  </defs>

  <!-- MOBILE STATUS BAR (Height: 44px) -->
  <rect x="0" y="0" width="390" height="44" fill="#0E141F"/>
  <text x="32" y="28" fill="#F8FAFC" font-size="13" font-weight="600">9:41</text>
  <rect x="330" y="18" width="22" height="11" rx="3" fill="#FFF" fill-opacity="0.8"/>
  <rect x="354" y="21" width="3" height="5" rx="1" fill="#FFF" fill-opacity="0.6"/>

  <!-- MOBILE APP HEADER (Height: 56px) -->
  <g transform="translate(0, 44)">
    <rect x="0" y="0" width="390" height="56" fill="url(#headerGradMob)" stroke="#1F293D" stroke-width="1"/>
    
    <!-- Logo -->
    <circle cx="28" cy="28" r="12" fill="#FF6B00"/>
    <path d="M24 33 Q28 20 32 33 Q28 30 24 33" fill="#FFF"/>
    <text x="48" y="33" fill="#F8FAFC" font-size="16" font-weight="700">PyroScope</text>

    <!-- Area Picker Button (Compact) -->
    <rect x="150" y="12" width="170" height="32" rx="16" fill="#161F30" stroke="#2D3B55"/>
    <text x="164" y="32" fill="#FF6B00" font-size="11" font-weight="600">CHT Preset ▾</text>

    <!-- Menu Hamburger -->
    <g transform="translate(345, 20)">
      <line x1="0" y1="4" x2="20" y2="4" stroke="#94A3B8" stroke-width="2"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="#94A3B8" stroke-width="2"/>
      <line x1="0" y1="16" x2="20" y2="16" stroke="#94A3B8" stroke-width="2"/>
    </g>
  </g>

  <!-- MAP VIEWPORT (Height: 380px) -->
  <g transform="translate(0, 100)">
    <rect x="0" y="0" width="390" height="380" fill="#0A0E17"/>
    
    <!-- Simplified Map Canvas -->
    <path d="M40 50 L120 40 L220 70 L300 140 L320 250 L280 320 L220 360 L140 330 L80 250 Z" fill="#131B2B" stroke="#2D3B55" stroke-width="1"/>
    <!-- CHT region -->
    <path d="M260 170 L310 180 L315 280 L270 310 L250 240 Z" fill="#1F293D" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Mobile H3 Hexagon Blobs -->
    <polygon points="275,200 285,195 295,200 295,212 285,217 275,212" fill="#D44842" opacity="0.9"/>
    <polygon points="287,215 297,210 307,215 307,227 297,232 287,227" fill="#FCFFA4" opacity="1" stroke="#FFF" stroke-width="1"/>
    <polygon points="275,230 285,225 295,230 295,242 285,247 275,242" fill="#F57D15" opacity="0.9"/>

    <!-- Map Floating Tools (Top-Right) -->
    <g transform="translate(340, 16)">
      <rect x="0" y="0" width="36" height="74" rx="6" fill="#0E141F" stroke="#2D3B55"/>
      <text x="13" y="24" fill="#F8FAFC" font-size="16" font-weight="700">+</text>
      <line x1="6" y1="36" x2="30" y2="36" stroke="#1F293D"/>
      <text x="14" y="58" fill="#F8FAFC" font-size="16" font-weight="700">−</text>
    </g>

    <!-- Compact Floating Stats Pill (Top-Left of Map) -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="180" height="42" rx="6" fill="#0E141F" fill-opacity="0.95" stroke="#1F293D"/>
      <text x="10" y="18" fill="#94A3B8" font-size="10">CHT Harmonized Events</text>
      <text x="10" y="34" fill="#FF6B00" font-size="13" font-weight="700">384/yr <tspan fill="#10B981" font-size="10 font-weight="500">(● Normal)</tspan></text>
    </g>

    <!-- Mobile Inferno Legend (Bottom-Left) -->
    <g transform="translate(16, 335)">
      <rect x="0" y="0" width="190" height="34" rx="4" fill="#0E141F" fill-opacity="0.9" stroke="#2D3B55"/>
      <rect x="8" y="10" width="100" height="6" rx="2" fill="url(#infernoMob)"/>
      <text x="116" y="16" fill="#94A3B8" font-size="9">0 to 300+ fires</text>
    </g>
  </g>

  <!-- COLLAPSIBLE BOTTOM SHEET: FIRECALENDAR & ANOMALIES (Height: 300px) -->
  <g transform="translate(0, 480)">
    <rect x="0" y="0" width="390" height="300" rx="16" fill="url(#sheetGrad)" stroke="#2D3B55" stroke-width="1.5"/>

    <!-- Drag Handle -->
    <rect x="175" y="10" width="40" height="4" rx="2" fill="#64748B"/>

    <!-- Bottom Sheet Header -->
    <text x="20" y="34" fill="#F8FAFC" font-size="15" font-weight="700">FireCalendar: CHT Season</text>
    <rect x="250" y="20" width="120" height="20" rx="10" fill="#1F293D"/>
    <text x="260" y="34" fill="#FF6B00" font-size="10" font-weight="600">Peak: Mar–May</text>

    <!-- Mobile Mini Calendar Matrix (Last 3 Years) -->
    <g transform="translate(20, 52)">
      <!-- Month header row -->
      <g transform="translate(40, 10)" fill="#64748B" font-size="8" font-family="monospace">
        <text x="0" y="0">J</text><text x="18" y="0">F</text><text x="36" y="0" fill="#FF6B00">M</text>
        <text x="54" y="0" fill="#FF6B00">A</text><text x="72" y="0" fill="#FF6B00">M</text><text x="90" y="0">J</text>
        <text x="108" y="0">J</text><text x="126" y="0">A</text><text x="144" y="0">S</text>
        <text x="162" y="0">O</text><text x="180" y="0">N</text><text x="198" y="0">D</text>
      </g>

      <!-- 2024 -->
      <text x="0" y="30" fill="#94A3B8" font-size="10" font-family="monospace">2024</text>
      <g transform="translate(36, 20)">
        <rect x="0" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="18" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="36" y="0" width="14" height="14" rx="2" fill="#D44842" stroke="#F59E0B"/><text x="40" y="10" fill="#FFF" font-size="7">▲</text>
        <rect x="54" y="0" width="14" height="14" rx="2" fill="#FCFFA4" stroke="#EF4444"/><text x="58" y="10" fill="#000" font-size="7">◆</text>
        <rect x="72" y="0" width="14" height="14" rx="2" fill="#F57D15"/>
        <rect x="90" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="108" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="126" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="144" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="162" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="180" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="198" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
      </g>

      <!-- 2023 -->
      <text x="0" y="50" fill="#94A3B8" font-size="10" font-family="monospace">2023</text>
      <g transform="translate(36, 40)">
        <rect x="0" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="18" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="36" y="0" width="14" height="14" rx="2" fill="#651A80"/>
        <rect x="54" y="0" width="14" height="14" rx="2" fill="#F57D15" stroke="#F59E0B"/><text x="58" y="10" fill="#FFF" font-size="7">▲</text>
        <rect x="72" y="0" width="14" height="14" rx="2" fill="#280B54"/>
        <rect x="90" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="108" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="126" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="144" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="162" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="180" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
        <rect x="198" y="0" width="14" height="14" rx="2" fill="#0E141F"/>
      </g>
    </g>

    <!-- Mobile Action Buttons -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="165" height="40" rx="6" fill="#0E141F" stroke="#FF6B00"/>
      <text x="24" y="25" fill="#FF6B00" font-size="12" font-weight="600">💬 Ask Assistant</text>

      <rect x="185" y="0" width="165" height="40" rx="6" fill="#0E141F" stroke="#2D3B55"/>
      <text x="200" y="25" fill="#F8FAFC" font-size="12">📈 The Hidden Jump</text>
    </g>

    <!-- Attribution Footer -->
    <text x="20" y="210" fill="#64748B" font-size="8">NASA FIRMS MODIS/VIIRS • geoBoundaries CC BY 3.0</text>
  </g>

  <!-- MOBILE BOTTOM NAVIGATION BAR (Height: 64px) -->
  <g transform="translate(0, 780)">
    <rect x="0" y="0" width="390" height="64" fill="#0A0E17" stroke="#1F293D" stroke-width="1"/>
    
    <g transform="translate(30, 16)">
      <text x="0" y="14" fill="#FF6B00" font-size="10" font-weight="700">Map</text>
      <circle cx="9" cy="22" r="2" fill="#FF6B00"/>
    </g>

    <g transform="translate(105, 16)">
      <text x="0" y="14" fill="#94A3B8" font-size="10">Calendar</text>
    </g>

    <g transform="translate(185, 16)">
      <text x="0" y="14" fill="#94A3B8" font-size="10">Hidden Jump</text>
    </g>

    <g transform="translate(275, 16)">
      <text x="0" y="14" fill="#94A3B8" font-size="10">Assistant</text>
    </g>

    <g transform="translate(345, 16)">
      <text x="0" y="14" fill="#94A3B8" font-size="10">Docs</text>
    </g>
  </g>
</svg>
